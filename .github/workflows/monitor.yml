
name: PSN India Stock Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libraries
        run: pip install -r requirements.txt
        
      - name: Debug repository files
        run: |
          pwd
          ls -la
          find . -maxdepth 3 -type f -print


      - name: Run PSN monitor
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Save stock history
        run: |
          git config user.name "PSN Stock Monitor"
          git config user.email "actions@users.noreply.github.com"
          git add stock_state.json
          git diff --cached --quiet || git commit -m "Update PSN stock history"
          git push
